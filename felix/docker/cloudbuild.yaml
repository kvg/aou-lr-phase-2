# Cloud Build config for felix/docker/Dockerfile
# Invoked from repo root via felix/build_docker.sh

substitutions:
  _IMAGE: us-central1-docker.pkg.dev/broad-dsp-lrma/aou-lr/felix-pilot
  _TAG: "0.1.0"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_32
  diskSizeGb: 200

timeout: 7200s

steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - --platform
      - linux/amd64
      - -f
      - felix/docker/Dockerfile
      - -t
      - ${_IMAGE}:${_TAG}
      - .

  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - ${_IMAGE}:${_TAG}

images:
  - ${_IMAGE}:${_TAG}
