# Mirror eichlerlab/locityper into Artifact Registry.
# From locityper/:
#   gcloud builds submit docker-locityper --config=docker-locityper/cloudbuild.yaml

substitutions:
  _IMAGE: us-central1-docker.pkg.dev/broad-dsp-lrma/aou-lr/aou-locityper
  _TAG: "1.4.5.0"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100

timeout: 3600s

steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - --platform
      - linux/amd64
      - -f
      - Dockerfile
      - -t
      - ${_IMAGE}:${_TAG}
      - .

  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - ${_IMAGE}:${_TAG}

images:
  - ${_IMAGE}:${_TAG}
