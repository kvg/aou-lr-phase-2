[package]
name = "extract-tracts-flare"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Streaming FLARE VCF ancestry tract extractor (Tractor extract_tracts_flare.py compatible)"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
# rust_backend (miniz_oxide) so the Linux binary can be fully static musl
# and run on the older glibc in wzhou88/saige:1.3.3.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
memchr = "2"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "extract-tracts-flare"
path = "src/main.rs"
