[package]
name = "tractor-mix-score"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Streaming TractorMix.score replacement (sparse GRM branch)"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1.10"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "tractor-mix-score"
path = "src/main.rs"

[[example]]
name = "micro_bench"
path = "examples/micro_bench.rs"
